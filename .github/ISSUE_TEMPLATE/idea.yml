name: Idea o necesidad
description: Cuéntanos qué problema de tu agencia debería resolver Hubly
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: ¿Qué problema tienes hoy?
      description: Cómo lo resuelves ahora y qué te quita tiempo.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: ¿Cómo te imaginas la solución?
