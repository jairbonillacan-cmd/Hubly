name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run check:muerto
      - run: npm run check:ui
      - run: npm run check:size
      - run: npm run check:capas
      - if: github.event_name == 'pull_request'
        run: node scripts/check-deuda.mjs origin/${{ github.base_ref }}
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:db

  flujos-con-cuentas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Levanta la app contra el Supabase simulado con las migraciones reales
        run: |
          node tests/dev-live.mjs 3210 54410 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3210/login && break; sleep 2; done
      - run: npx playwright test e2e/fusion-live.spec.ts e2e/marcas-live.spec.ts e2e/chat-live.spec.ts e2e/critico-live.spec.ts
        env:
          E2E_LIVE: "1"
          E2E_PORT: "3210"
          E2E_MOCK_PORT: "54410"

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
